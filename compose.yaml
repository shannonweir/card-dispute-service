name: card-dispute-service

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dispute-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  card-dispute-service:
    build: .
    stop_grace_period: 35s
    environment:
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_URL: jdbc:postgresql://database:5432/${DB_NAME:?Set DB_NAME in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      AUTH0_ISSUER_URI: ${AUTH0_ISSUER_URI:?Set AUTH0_ISSUER_URI in .env}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?Set AUTH0_AUDIENCE in .env}
      # Flyway demo-data initialization only; runtime authorization uses database mappings.
      AUTH0_DEMO_SUBJECT: ${AUTH0_DEMO_SUBJECT:?Set AUTH0_DEMO_SUBJECT in .env}
      AUTH0_SECOND_DEMO_SUBJECT: ${AUTH0_SECOND_DEMO_SUBJECT:?Set AUTH0_SECOND_DEMO_SUBJECT in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  dispute-data:
