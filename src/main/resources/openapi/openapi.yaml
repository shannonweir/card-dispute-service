components:
  schemas:
    CustomerType:
      type: string
      enum: [INDIVIDUAL, BUSINESS]
    CustomerProfile:
      type: object
      required: [id, displayName, type, accounts]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        type:
          $ref: '#/components/schemas/CustomerType'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountSummary'
    AccountType:
      type: string
      enum: [CURRENT, CREDIT_CARD, SAVINGS]
    AccountSummary:
      type: object
      required: [id, displayName, type, maskedNumber, currency]
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        id:
          type: string
          format: uuid
        displayName:
          type: string
        maskedNumber:
          type: string
        currency:
          type: string
          pattern: '^[A-Z]{3}$'

    CreateDispute:
      required:
      - details
      - reason
      - transactionId
      type: object
      properties:
        transactionId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/DisputeReason'
        details:
          maxLength: 2000
          minLength: 10
          type: string
          pattern: '[\s\S]*\S[\s\S]*'
          x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
    Problem:
      description: RFC 9457 Problem Details. The code extension is a stable application error code; errorId is a support reference for unexpected server failures.
      type: object
      required: [type, title, status, detail, instance, code]
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          example: A dispute already exists for this transaction
        instance:
          type: string
          format: uri-reference
          example: /api/v1/disputes
        code:
          type: string
          example: CONFLICT
        errorId:
          type: string
          format: uuid
      additionalProperties: true
    Dispute:
      required:
      - accountId
      - customerId
      - createdAt
      - details
      - id
      - reason
      - reference
      - status
      - transactionId
      - updatedAt
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        reference:
          type: string
        transactionId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/DisputeReason'
        details:
          type: string
        status:
          $ref: '#/components/schemas/DisputeStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        resolutionNote:
          type: string
          nullable: true
    DisputeDocument:
      required:
      - contentType
      - fileName
      - id
      - sizeBytes
      - uploadedAt
      type: object
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        uploadedAt:
          type: string
          format: date-time
    Money:
      required:
      - amount
      - currency
      type: object
      properties:
        amount:
          multipleOf: 0.01
          type: number
        currency:
          pattern: ^[A-Z]{3}$
          type: string
    Transaction:
      required:
      - accountId
      - customerId
      - amount
      - disputeEligible
      - id
      - merchant
      - occurredAt
      - reference
      - status
      - type
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        reference:
          type: string
        merchant:
          type: string
        merchantLocation:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        occurredAt:
          type: string
          format: date-time
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        cardLastFour:
          pattern: ^[0-9]{4}$
          type: string
        disputeEligible:
          description: True for owned posted transactions with no non-closed dispute.
          type: boolean
        disputeIneligibilityReason:
          type: string
          nullable: true
        disputeId:
          description: Non-closed dispute ID, or null when no non-closed dispute exists. Closed cases remain available in the dispute list.
          type: string
          format: uuid
          nullable: true
    TransactionPage:
      required:
      - content
      - page
      - size
      - totalElements
      - totalPages
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    DisputePage:
      required:
      - content
      - page
      - size
      - totalElements
      - totalPages
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Dispute'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    TimelineEvent:
      required:
      - description
      - id
      - occurredAt
      - status
      - title
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DisputeStatus'
        title:
          type: string
        description:
          type: string
        occurredAt:
          type: string
          format: date-time
        actionRequired:
          type: boolean
    DisputeSummary:
      required:
      - disputesSubmitted
      - inProgress
      - resolved
      - rejected
      - totalTransactions
      type: object
      properties:
        totalTransactions:
          type: integer
          format: int64
        disputesSubmitted:
          type: integer
          format: int64
        inProgress:
          type: integer
          format: int64
        resolved:
          description: Cases with status RESOLVED or CLOSED. Rejected cases are counted separately.
          type: integer
          format: int64
        rejected:
          description: Cases with status REJECTED.
          type: integer
          format: int64
    DisputeReasonOption:
      required:
      - code
      - label
      type: object
      properties:
        code:
          $ref: '#/components/schemas/DisputeReason'
        label:
          type: string
    TransactionStatus:
      type: string
      enum:
      - PENDING
      - POSTED
      - REVERSED
    DisputeReason:
      type: string
      enum:
      - UNAUTHORISED
      - DUPLICATE_CHARGE
      - INCORRECT_AMOUNT
      - GOODS_NOT_RECEIVED
      - REFUND_NOT_RECEIVED
      - OTHER
    DisputeStatus:
      type: string
      enum:
      - SUBMITTED
      - UNDER_REVIEW
      - INFORMATION_REQUESTED
      - INVESTIGATING
      - RESOLVED
      - REJECTED
      - CLOSED
    TransactionType:
      type: string
      enum:
      - GROCERIES
      - TRANSPORT
      - ENTERTAINMENT
      - FUEL
      - SHOPPING
      - DINING
      - TRAVEL
      - OTHER
  securitySchemes:
    bearerAuth:
      type: http
      description: Auth0 OAuth 2.0 access token issued for this API audience
      scheme: bearer
      bearerFormat: JWT
