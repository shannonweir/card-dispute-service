# Canonical API contract, bootstrapped from the existing Java implementation.
openapi: 3.0.1
info:
  title: Card Dispute Portal API
  description: Secure customer transaction and dispute management API. Transactions
    and disputes are scoped to the authenticated customer.
  contact:
    name: Card Dispute Platform Team
  license:
    name: Internal use
  version: 3.0.0
servers:
- url: /
  description: Current environment
paths:
  /api/v1/customer:
    get:
      tags: [Customer]
      operationId: getCurrentCustomer
      description: Returns the customer identified by the validated login, including their accounts. Customer identity is never selected by the caller.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The logged-in customer and their accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Login is not linked to a customer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server failure; use errorId when contacting support
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/disputes:
    get:
      tags:
      - Dispute
      operationId: getDisputes
      parameters:
      - name: accountId
        in: query
        required: false
        description: Restrict results to one of the logged-in customer's accounts; omit for all their accounts. An inaccessible account returns 404.
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 20
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DisputeStatus'
      responses:
        '404':
          description: Account was not found or is not owned by this customer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Authentication required or token invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access to this resource is forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputePage'
        '500':
          description: Unexpected server failure; use errorId when contacting support
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: [
          ]
    post:
      tags:
      - Dispute
      description: An Idempotency-Key can be retried with the same payload; changed
        payloads return 409. Only owned, posted transactions without a non-closed dispute
        are eligible. A new dispute is allowed only after all previous disputes are CLOSED.
        Retrying a previous Idempotency-Key still returns its original dispute, even if CLOSED.
      operationId: createDispute
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          maxLength: 128
          minLength: 8
          type: string
          pattern: '[\s\S]*\S[\s\S]*'
        x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDispute'
        required: true
      responses:
        '201':
          description: Dispute created
          headers:
            Location:
              description: URL of the created dispute
              style: simple
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '400':
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Authentication required or token invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found or not owned by this customer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Duplicate dispute or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Transaction is not eligible for a dispute
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access to this resource is forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server failure; use errorId when contacting support
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: [
          ]
  /api/v1/disputes/{disputeId}/documents:
    get:
      tags:
      - Documents
      operationId: getDisputeDocuments
      parameters:
      - name: disputeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Authentication required or token invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found or not owned by this customer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access to this resource is forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DisputeDocument'
        '500':
          description: Unexpected server failure; use errorId when contacting support
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: [
          ]
    post:
      tags:
      - Documents
      description: PDF, PNG or JPEG up to 5 MB. Checks ownership, file size, file signature and declared MIME type. Malware scanning is outside this assessment scope. This API exposes upload metadata only; no file download is provided.
      operationId: uploadDisputeDocument
      parameters:
      - name: disputeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '400':
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Authentication required or token invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found or not owned by this customer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: File exceeds 5 MB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported file format
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access to this resource is forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeDocument'
        '500':
          description: Unexpected server failure; use errorId when contacting support
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: [
          ]
