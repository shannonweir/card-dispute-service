spring:
  application:
    name: card-dispute-service
  datasource:
    url: jdbc:postgresql://localhost:5432/card_disputes
    username: "card_disputes"
    password: "postgres"
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/demo
    placeholders:
      auth0-issuer: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
      auth0-demo-subject: "auth0|6acc0b351f3fb75f306214bb"
      auth0-second-demo-subject: "auth0|6acc0d0b3eaa494f24fbd942"
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "https://dev-1fnyw5sg2ehum1ph.us.auth0.com/"
          audiences:
            - "https://api.carddisputeportal.local"
          jws-algorithms: RS256

server:
  shutdown: graceful
  error:
    include-message: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGIN:http://localhost:4200}}

logging:
  level:
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  enable-default-api-docs: false
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_0
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
