spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: card-dispute-service
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME}}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/demo
    placeholders:
      auth0-issuer: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
      # Used only by Flyway to initialize demo identity mappings, not to authenticate requests.
      auth0-demo-subject: ${AUTH0_DEMO_SUBJECT}
      auth0-second-demo-subject: ${AUTH0_SECOND_DEMO_SUBJECT}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}
          audiences:
            - ${AUTH0_AUDIENCE}
          jws-algorithms: RS256

server:
  shutdown: graceful
  error:
    include-message: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  enable-default-api-docs: false
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_0
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
